name: News Post

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options:
          - news
          - calendar
        default: news
  schedule:
    - cron: "7 0-16/2 * * 1-5"
    - cron: "47 12 * * 1-5"
    - cron: "47 13 * * 1-5"
    - cron: "30 0 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      posted: ${{ steps.gen.outputs.posted }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Set site address
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          echo "SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"

      - name: Choose what to run
        run: |
          SCRIPT="news_post.py"
          if [ "${{ github.event.schedule }}" = "30 0 * * 1-5" ] || [ "${{ github.event.inputs.mode }}" = "calendar" ]; then
            SCRIPT="calendar_post.py"
          fi
          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"

      - name: Write article and image
        id: gen
        working-directory: scripts
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POST_LANGUAGE: English
          MIN_IMPACT: "6"
          MAX_POSTS_PER_DAY: "8"
          CAL_IMPACTS: "High"
          CAL_WINDOW_HOURS: "24"
        run: python "$SCRIPT"

      - name: Save to repository
        if: steps.gen.outputs.posted == 'true'
        run: |
          git config user.name "market-code-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs scripts/history.json scripts/last_post.json
          git diff --staged --quiet || git commit -m "New article"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.gen.outputs.posted == 'true'
        with:
          path: docs

  deploy:
    needs: build
    if: needs.build.outputs.posted == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  telegram:
    needs: [build, deploy]
    if: needs.build.outputs.posted == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install requests

      - name: Send to Telegram
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py

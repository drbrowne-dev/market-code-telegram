name: Rebuild Site

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set site address
        env:
          CUSTOM_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$CUSTOM_URL" ]; then
            echo "SITE_URL=${CUSTOM_URL%/}" >> "$GITHUB_ENV"
          else
            OWNER="${GITHUB_REPOSITORY_OWNER,,}"
            REPO="${GITHUB_REPOSITORY#*/}"
            echo "SITE_URL=https://${OWNER}.github.io/${REPO}" >> "$GITHUB_ENV"
          fi

      - name: Rebuild pages
        working-directory: scripts
        run: python rebuild_site.py

      - name: Save to repository
        run: |
          git config user.name "market-code-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Rebuild site"
          git pull --rebase
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
